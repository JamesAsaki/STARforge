[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "STARforge"
version = "0.1.0"
description = "STARforge CLI for the ATX/10x barcode-counting pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib",
  "numpy",
  "pandas",
  "polars",
  "seaborn",
]

[project.scripts]
atx_tenx_count = "atx_tenx_count.cli:main"

[tool.setuptools]
packages = ["atx_tenx_count"]
